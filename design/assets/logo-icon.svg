<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="sqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="sqEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="sqAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <linearGradient id="sqCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="sqGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#sqBgGrad)" stroke="#334155" stroke-width="4"/>
  
  <!-- Subtle inner circuit ring -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="10 10" opacity="0.6"/>

  <!-- Code bracket spine -->
  <path d="M 82 72 L 82 176 Q 82 188 94 188 L 114 188" fill="none" stroke="url(#sqCyan)" stroke-width="12" stroke-linecap="round"/>

  <!-- Top branch (Growth / Innovation) -->
  <path d="M 82 76 Q 128 68 168 88" fill="none" stroke="url(#sqEmerald)" stroke-width="14" stroke-linecap="round" filter="url(#sqGlow)"/>
  <circle cx="172" cy="90" r="11" fill="#34D399"/>

  <!-- Middle branch (Warm African Sun / Opportunity) -->
  <path d="M 82 128 L 156 128" fill="none" stroke="url(#sqAmber)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="160" cy="128" r="11" fill="#FCD34D"/>

  <!-- Bottom branch (Community Foundation) -->
  <path d="M 94 180 Q 128 184 184 160" fill="none" stroke="url(#sqEmerald)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="188" cy="158" r="11" fill="#38BDF8"/>

  <!-- Central Interlocking Community Node -->
  <circle cx="128" cy="128" r="15" fill="#0F172A" stroke="#F59E0B" stroke-width="5"/>
  <circle cx="128" cy="128" r="6" fill="#34D399"/>
</svg>
