<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Emerald Tech Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Warm Solar Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- LOGO ICON (Left) -->
  <g transform="translate(20, 16)">
    <!-- Rounded Squircle Base -->
    <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#iconBgGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Outer Network Ring / Circuit Nodes -->
    <circle cx="64" cy="64" r="50" fill="none" stroke="#1E293B" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Dynamic African Branch / Code Nodes Symbolizing 'E' & Elevation -->
    <!-- Left vertical stem of E (Code bracket style) -->
    <path d="M 40 38 L 40 90 Q 40 96 46 96 L 56 96" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top Branch (Emerald Green) -->
    <path d="M 40 40 Q 64 36 84 46" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="86" cy="47" r="6" fill="#34D399"/>

    <!-- Middle Branch / Rising Horizon (Solar Amber) -->
    <path d="M 40 64 L 78 64" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round" filter="url(#amberGlow)"/>
    <circle cx="80" cy="64" r="6" fill="#FCD34D"/>

    <!-- Bottom Branch (Emerald to Cyan) -->
    <path d="M 46 92 Q 64 94 92 82" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="94" cy="81" r="6" fill="#38BDF8"/>

    <!-- Central Interlocking Core (The 'Uno' Union Node) -->
    <circle cx="64" cy="64" r="8" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="64" cy="64" r="3" fill="#34D399"/>
  </g>

  <!-- TYPOGRAPHY (Right) -->
  <g transform="translate(170, 92)">
    <!-- Evol -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
      Evol<tspan fill="url(#amberGrad)">uno</tspan>
    </text>

    <!-- Tagline & Badge -->
    <text x="4" y="28" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="15" font-weight="600" fill="#94A3B8" letter-spacing="1.8">
      AFRICAN DEVELOPER NETWORK
    </text>

    <!-- Glowing Tech Pill Badge -->
    <g transform="translate(325, -60)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#064E3B" stroke="#059669" stroke-width="1.5"/>
      <circle cx="14" cy="13" r="4" fill="#34D399"/>
      <text x="26" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0" letter-spacing="0.5">DEV FOR DEV</text>
    </g>
  </g>
</svg>
